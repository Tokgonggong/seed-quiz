<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Seed Are You?</title>
<link rel="preload" as="image" href="assets/scene/land_front.webp" type="image/webp">
<link rel="preload" as="image" href="assets/scene/land_back.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mali:wght@400;500;600;700&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<style>
/* VOICE  everyday, playful: a kawaii carrd-style quiz about how you help a community garden grow
   IDEA   a little garden shop window: gingham awning, brown-outlined frame, sky and grassy hills behind
   PICTURE question art + seed character art (placeholders until the PNGs arrive), drawn sprout scene on the cover
   COLOUR vanilla #FFF9E3, #FEFAC2, buttermilk #FFF1B5, #FFD87B, pastel blue #C1DBE8, slate #314C66, burgundy #43302E, cocoa #674A47
   TYPE   Sniglet (chunky rounded titles) + Mali (hand-lettered body)
   LAYOUT one centred shop-window card up to 600px on every screen; results stack like the kueh card */
:root{color-scheme:light;--leaf:#314c66}
/* ===== editable colour settings (the colour editor changes these) ===== */
:root{
--page-bg:#c1dbe8;--card-bg:#fefac2;--card-dots:#fff;--paper:#fff9e3;--ink:#43302e;--brown:#43302e;--soft:#674a47;
--bar-bg:#43302e;--bar-text:#fff9e3;--snd-bg:#674a47;--focus:#314c66;
--check:rgba(44,74,122,.62);--check-bg:#fff;--scallop:#3a5a8c;--plaque-ring:#ffd87b;--win-shadow:rgba(67,48,46,.3);--box-shadow:rgba(67,48,46,.22);
--start-bg:#ffd87b;--start-text:#43302e;--start-line:#3d6182;
--opt-bg:#fff9e3;--a-line:#7fa9bf;--a-badge:#c1dbe8;--a-badge-text:#43302e;--a-on:#e3eff5;
--b-line:#3fa9c9;--b-badge:#95e0f5;--b-badge-text:#43302e;--b-on:#dcf5fc;
--c-line:#3d6182;--c-badge:#3d6182;--c-badge-text:#fff9e3;--c-on:#dde6ef;
--light-btn:#98c2eb;--light-btn-text:#43302e;--deep-btn:#3d6182;--deep-btn-text:#fff9e3;--signup-btn:#ffd87b;--signup-btn-text:#43302e;
--peek-btn:#fff9e3;--fq-head:#98c2eb;--fq-head-text:#43302e;--space-row:#fefac2;--space-label:#ffd87b;--space-label-text:#43302e;
--by-label:#3d6182;--by-label-text:#fff9e3;--by-row:#e4f2f6;--by-line:#3d6182;--meter:#674a47;--meter-track:#ece0cc;--quote-bg:#fff1b5;
--cta-head:#3d6182;--cta-head-text:#fff9e3;--cta-shadow:#98c2eb;--toast-bg:#43302e;--toast-text:#fff;
--style-bg:#fff;--link:#3d6182;--chip-bg:#fff;--path-line:#b59a72;--here-bg:#43302e;--here-text:#fff9e3;--role-bg:#fff9e3;--role-text:#674a47;--next-bg:#fff1b5}

*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%}
body{background:var(--page-bg);color:var(--ink);font:500 16px/1.55 Mali,"Comic Sans MS",system-ui,sans-serif;overflow-x:clip}
.scene{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.wrap{position:relative;z-index:1;padding:clamp(16px,4vw,40px) max(16px,4vw) 48px}
.win{max-width:600px;margin:0 auto;background:var(--paper);border-radius:26px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bar-bg);color:var(--bar-text);padding:6px 14px;font-size:14px}
.bar b{font-family:Fredoka,"Trebuchet MS",sans-serif;font-weight:500;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.snd{font:inherit;color:inherit;background:var(--snd-bg);border:0;border-radius:99px;padding:4px 12px;min-height:32px;display:flex;align-items:center;gap:6px;cursor:pointer;position:relative}
.snd::after{content:"";position:absolute;inset:-6px -2px}
.snd:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.bar .snd:focus-visible{outline-color:#ffd87b}
[tabindex="-1"]:focus{outline:none}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.awn{position:relative;background-color:var(--check-bg);background-image:linear-gradient(90deg,var(--check) 50%,transparent 50%),linear-gradient(var(--check) 50%,transparent 50%);background-size:24px 24px;padding:22px 19px 33px;text-align:center}
.plaque{display:inline-block;background:var(--paper);border-radius:16px;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--plaque-ring);padding:11px 25px 9px;max-width:100%}
.plaque h1{font:800 clamp(26px,6vw,38px)/1.05 Sniglet,sans-serif;margin:0;color:var(--brown);letter-spacing:.02em;line-height:1.12}
.plaque p{margin:2px 0 0;font-size:14px;color:var(--soft)}
main{background:radial-gradient(circle,var(--card-dots) 4px,transparent 4.6px) 0 0/56px 52px,radial-gradient(circle,var(--card-dots) 4px,transparent 4.6px) 28px 26px/56px 52px,var(--card-bg);padding:34px calc(clamp(16px,4vw,32px) + 3px) 28px}
.foot{background-color:var(--check-bg);background-image:linear-gradient(90deg,var(--check) 50%,transparent 50%),linear-gradient(var(--check) 50%,transparent 50%);background-size:24px 24px;text-align:center;padding:13px 15px 10px;font-size:13px}
.foot span{background:var(--paper);border-radius:99px;padding:5px 16px;display:inline-block}
.in{animation:pop .38s cubic-bezier(.3,1.5,.6,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
h2,h3{font-family:Sniglet,sans-serif;color:var(--brown);margin:0;line-height:1.1}
p{margin:0 0 .8em}
.btn{font:600 18px Fredoka,"Trebuchet MS",sans-serif;letter-spacing:.03em;color:#fff9e3;border:0;border-radius:99px;padding:13px 29px;min-height:52px;cursor:pointer;background:var(--leaf);transition:transform .08s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
@media(hover:hover){.btn:hover{filter:brightness(1.06)}}
.btn:active{transform:translateY(3px)}
.btn.pk{background:#43302e;color:#fff1b5}.btn.sun{background:var(--signup-btn);color:var(--signup-btn-text)}.btn.sky{background:var(--light-btn);color:var(--light-btn-text)}.btn.deep{background:var(--deep-btn);color:var(--deep-btn-text)}.btn.gh{background:var(--peek-btn);color:var(--brown)}
.cover{display:block;width:100%;height:auto;border-radius:20px;background:#c1dbe8}
.intro{background:var(--paper);border-radius:18px;padding:19px 21px 9px;margin:18px 0}
.center{text-align:center}
.meta{font-size:14px;color:var(--soft);margin-top:10px}
.go{padding:14px 0 4px}.go .meta{margin:16px 0 0}
.prog{display:flex;justify-content:center;gap:10px;margin:-6px 0 16px}
.prog i{width:40px;height:36px;display:grid;place-items:end center;background:radial-gradient(ellipse 18px 6px at 50% 92%,#9b6b47 98%,transparent)}
.prog i.cur svg{animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.ph{display:grid;place-items:center;align-content:center;gap:2px;text-align:center;color:#8a7068;background:#fff9e3 radial-gradient(#f6e3a6 2px,transparent 2.6px) 0 0/14px 14px;border-radius:20px;padding:15px}
.ph svg:not(.pn){width:46px;height:46px}
.ph b{font:500 15px Fredoka,"Trebuchet MS",sans-serif}.ph small{font-size:13px}
.qimg{width:min(100%,calc(max(240px,min(50vh,420px))*4/3));margin-inline:auto;aspect-ratio:4/3;object-fit:contain;border-radius:20px}
.qw{display:block;background:#fff}.qw img{display:block;width:100%;height:100%;object-fit:contain;border-radius:inherit}
.qnum{font:600 15px Fredoka,"Trebuchet MS",sans-serif;letter-spacing:.02em;color:var(--soft);margin:18px 0 4px}
.qt{font-size:clamp(21px,4.6vw,25px);margin-bottom:16px;text-wrap:balance}
.opts{display:grid;gap:12px}
.opt{font:500 16px/1.45 Mali,sans-serif;color:var(--ink);text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:15px 19px 15px 15px;border:0;border-radius:22px;background:var(--bg);cursor:pointer;transition:transform .1s}
@media(hover:hover){.opt:hover{transform:translateY(-2px)}}
.opt:active,.opt.on{transform:translateY(3px)}
.opt.on{background:var(--on)}
.opt.on .k{position:relative;color:transparent;animation:kpop .25s ease-out}
.opt.on .k::after{content:"";position:absolute;left:50%;top:45%;width:7px;height:13px;margin:-8px 0 0 -4px;border:solid var(--kc);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
@keyframes kpop{50%{transform:scale(1.25)}}
.opt .k{width:34px;height:34px;border-radius:50%;background:var(--kb);color:var(--kc,#fff);display:grid;place-items:center;font:600 17px Fredoka,"Trebuchet MS",sans-serif}
.c0{--bg:var(--opt-bg);--bd:var(--a-line);--kb:var(--a-badge);--kc:var(--a-badge-text);--on:var(--a-on)}.c1{--bg:var(--opt-bg);--bd:var(--b-line);--kb:var(--b-badge);--kc:var(--b-badge-text);--on:var(--b-on)}.c2{--bg:var(--opt-bg);--bd:var(--c-line);--kb:var(--c-badge);--kc:var(--c-badge-text);--on:var(--c-on)}
.back{margin-top:18px;background:none;border:0;font:500 15px Mali,sans-serif;color:var(--soft);cursor:pointer;min-height:44px;padding:0 6px;text-decoration:underline;text-underline-offset:3px}
.grow{width:180px;height:150px;margin:0 auto 6px;display:block}
.grow .st{transform-origin:90px 120px;animation:up 1.4s cubic-bezier(.3,1.4,.6,1) both}
@keyframes up{from{transform:scaleY(0)}}
.rtop{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px 22px;align-items:stretch}
.rh{grid-column:1/-1;text-align:center}
.rtop .plate{grid-column:1;grid-row:2}
.rtop .pills{grid-column:2;grid-row:2}
.ya{font:500 20px Fredoka,"Trebuchet MS",sans-serif;letter-spacing:.02em;color:var(--brown);margin:0}
.rname{font:700 44px/1.1 Fredoka,"Trebuchet MS",sans-serif;letter-spacing:.01em;white-space:nowrap;color:var(--c);-webkit-text-stroke:1.5px var(--brown);paint-order:stroke fill;margin:4px 0 0}
.pills{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
.pills li{font:600 20px Fredoka,"Trebuchet MS",sans-serif;letter-spacing:.04em;color:#fff;text-align:center;border-radius:99px;padding:13px 10px}
.pills li{position:relative}.stm{position:absolute;left:50%;top:-44px;width:38px;height:47px;margin-left:-19px;pointer-events:none}
.pills li:has(.stm){margin-top:30px}
.pills .p0{background:#ffd87b;color:#43302e}.pills .p1{background:#c1dbe8;color:#43302e}.pills .p2{background:#314c66;color:#fff9e3}
.plate{width:100%;aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(var(--t) 0 10deg,#fff 0 20deg);padding:16px}
.plate>:not(.pn){width:100%;height:100%;border-radius:50%;object-fit:contain;background:var(--paper) radial-gradient(var(--t) 2px,transparent 2.6px) 0 0/14px 14px}
.plate .ph{padding:21px}
.tag{display:inline-block;margin:22px 0 0;font:500 14px Fredoka,"Trebuchet MS",sans-serif;letter-spacing:.02em;background:var(--t);color:var(--brown);border-radius:99px;padding:5px 14px}
.box{background:var(--paper);border-radius:18px;margin-top:18px}
.box>h3{background:var(--hd,#ffd87b);color:var(--hc2,#43302e);font-family:Fredoka,"Trebuchet MS",sans-serif;font-weight:600;letter-spacing:.03em;font-size:20px;text-align:center;padding:11px 15px 11px;border-radius:18px 18px 0 0}
.box>.bd{padding:14px 21px 7px}
.about{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr)}
.about>h3{display:grid;place-items:center;padding:11px 15px;border-radius:18px 0 0 18px;font-size:22px}
.about>.bd{padding:17px 19px 5px}
.pts{margin:0 0 10px;padding:0;list-style:none;display:grid;gap:9px}
.pts li{padding-left:22px;position:relative}
.pts li::before{content:"";position:absolute;left:2px;top:.45em;width:11px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#fff;border:1.5px solid var(--brown)}
.pts b{color:var(--brown)}
.edge li::before{background:#fff}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0 42px}
.fq>h3{font-size:clamp(22px,4.6vw,26px);padding:15px 17px;line-height:1.2}
.mini{border:0;border-radius:18px;background:var(--mb,var(--t));text-align:center;cursor:pointer;padding:0 0 13px;font:inherit;color:var(--ink);transition:transform .1s}
@media(hover:hover){.mini:hover{transform:translateY(-2px)}}
.mini:active{transform:translateY(3px)}
.mini .mh{display:block;margin:0 0 10px;background:var(--mh,#674a47);color:var(--mt,#fff9e3);font:600 15px Fredoka,"Trebuchet MS",sans-serif;letter-spacing:.03em;padding:9px 9px;border-radius:18px 18px 0 0}
.mini .face{display:block;width:88px;height:88px;margin:0 auto 6px;border-radius:50%}
.mini .face.ph{padding:9px}.mini .face.ph svg:not(.pn){width:34px;height:34px}.mini .face.ph small,.mini .face.ph b{display:none}
.mini .mn{font:600 16px Fredoka,"Trebuchet MS",sans-serif;color:var(--brown)}
.fr{display:grid;gap:8px;margin-bottom:12px}
.row{display:grid;grid-template-columns:106px minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border-radius:12px;background:var(--space-row)}
.row.me{background:var(--mt)}
.row.by{background:var(--by-row)}
.row em{font:600 13px/1.2 Fredoka,"Trebuchet MS",sans-serif;letter-spacing:.04em;font-style:normal;color:var(--rt,#43302e);background:var(--rc);border-radius:99px;padding:6px 2px;text-align:center}
.row small{display:block;font-size:13px;color:var(--soft);margin-top:2px}
.meter{height:8px;background:var(--meter-track);border-radius:9px;margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--meter)}
.row.me .meter i{background:var(--mo)}
.big{font-family:Fredoka,"Trebuchet MS",sans-serif;font-weight:500;font-size:19px;color:var(--brown);text-align:center;background:var(--quote-bg);border-radius:14px;padding:10px 12px}
.cta .bd{text-align:center;padding:18px 22px 8px}
.box.cta{margin-top:30px;margin-bottom:10px}
.cta>h3{font-size:24px;padding:16px 16px 15px}
.cta .btn{font-size:21px;padding:15px 39px;min-height:58px}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}
.peek{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;background:var(--paper);border-radius:99px;padding:8px 8px 8px 20px;margin:-14px 0 20px;font-size:14px;line-height:1.3}
.peek .btn{min-height:34px;padding:5px 16px;font-size:14px;flex:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--toast-bg);color:var(--toast-text);padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .25s,transform .25s;z-index:5;pointer-events:none;font-size:15px;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:350px){.duo{grid-template-columns:minmax(0,1fr)}}
@media(max-width:460px){.box.sumc{padding:18px 12px 14px}.hstyle{padding:12px 11px 8px}.strip{gap:5px}.path{padding-left:30px}.path::before{left:10px}.stone .node{left:-30px}.peek{border-radius:16px;padding:10px 10px 10px 16px}.rtop{grid-template-columns:minmax(0,172px) minmax(0,1fr);gap:18px 14px}.pills{gap:10px}.pills li{font-size:15px;padding:10px 6px;letter-spacing:.02em}.plate{padding:12px}.about{grid-template-columns:minmax(0,1fr)}.about>h3{border-radius:18px 18px 0 0;padding:11px 15px}.about>.bd{padding-top:14px}.row{grid-template-columns:minmax(0,1fr);gap:6px}.row em{justify-self:start;padding:5px 14px}.btns .btn{padding:13px 15px}}
.pl,.pl [data-s],.wg,.bfm{transform-box:view-box;transform-origin:0 0}
.pl{transform:scale(.12);transition:transform 1s cubic-bezier(.3,1.45,.5,1) var(--d,0s)}
.g1 .pl{transform:scale(.36)}.g2 .pl{transform:scale(.56)}.g3 .pl{transform:scale(.74)}.g4 .pl{transform:scale(.88)}.g5 .pl{transform:scale(1)}
.pl [data-s]{transform:scale(0);transition:transform .7s cubic-bezier(.3,1.7,.5,1) calc(var(--d,0s) + .25s)}
.g1 [data-s="1"],.g2 [data-s="2"],.g3 [data-s="3"],.g4 [data-s="4"],.g5 [data-s="5"]{transform:scale(1)}
.bf{opacity:0;transition:opacity 1.2s .6s}.g5 .bf{opacity:1}
.bfm{animation:fly 9s ease-in-out infinite}
.wg{animation:flap .22s ease-in-out infinite alternate}
.wg2{transform-box:view-box;transform-origin:0 0;animation:flap2 .26s ease-in-out infinite alternate}
@keyframes flap2{to{transform:scaleX(.45) skewY(10deg)}}
@keyframes fly{25%{transform:translate(46px,-34px) rotate(8deg)}50%{transform:translate(92px,-6px)}75%{transform:translate(44px,26px) rotate(-8deg)}}
@keyframes flap{to{transform:scaleX(.55)}}
.clouds{animation:drift 70s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(60px)}}
.bed{display:none;position:relative;height:128px;overflow:hidden}
.bed::after,.grain{content:"";background:var(--grain);pointer-events:none}
.bed::after{position:absolute;inset:0}
.grain{position:fixed;inset:0;z-index:0;opacity:.55}
.spk{opacity:0;transition:opacity .8s 1s}.g5 .spk{opacity:1}
.tw,.bird{transform-box:view-box;transform-origin:0 0}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.5) rotate(25deg)}}
.bird{transform:scale(0);transition:transform .6s cubic-bezier(.3,1.7,.5,1) 1.2s}.g5 .bird{transform:scale(1)}
.bed svg:not(.pn){display:block;width:100%;height:100%}
@media(max-width:760px){.bed{display:block}}
.intro p,.opt span,.box .bd p,.pts li{text-wrap:pretty}
.hint2{font:600 15px Fredoka,"Trebuchet MS",sans-serif;color:var(--soft);margin:-8px auto 20px;max-width:30em}
/* ---------- result: seed card (the share asset) ---------- */
.box.sumc{margin-top:0;padding:20px 16px 16px}
.hstyle{background:var(--style-bg);border-radius:16px;padding:12px 14px 6px;margin-top:18px;text-align:left}
.hstyle .lab{font:600 13px Fredoka,"Trebuchet MS",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:0}
.hq{font:600 20px/1.3 Fredoka,"Trebuchet MS",sans-serif;color:var(--brown);margin:6px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.hchip,.word{font:800 19px/1 Sniglet,sans-serif;letter-spacing:.03em;border-radius:10px;padding:6px 10px 4px;background:var(--s);color:var(--st)}
.hchip small,.word small{font:600 11px Fredoka,"Trebuchet MS",sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-left:3px}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 2px}
.strip .sc{display:grid;justify-items:center;gap:5px;font:700 13px Fredoka,"Trebuchet MS",sans-serif;color:var(--brown)}
.pin{font:700 10.5px/1 Fredoka,"Trebuchet MS",sans-serif;letter-spacing:.05em;text-transform:uppercase;background:var(--here-bg);color:var(--here-text);border-radius:7px;padding:4px 6px 3px;white-space:nowrap;visibility:hidden}
.sc.on .pin,.sc.goal .pin{visibility:visible}
.sc.goal .pin{background:var(--space-label);color:var(--space-label-text)}
.sbar{display:block;width:100%;height:14px;border-radius:99px;background:var(--meter-track)}
.sc.on .sbar{background:var(--s)}
.sc.goal .sbar{background:repeating-linear-gradient(45deg,var(--by-row) 0 5px,var(--chip-bg) 5px 10px)}
.axis{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--soft);margin:3px 0 8px}
.small{font-size:14px;line-height:1.45;color:var(--soft);margin:0 0 8px}
.lnk{color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:3px 0;white-space:normal}
.shr{display:flex;align-items:center;justify-content:center;gap:10px 14px;margin-top:14px}
.shr .btn{flex:none;min-height:48px;padding:10px 22px;font-size:17px}
.shr .hint{font-size:13.5px;line-height:1.35;color:var(--soft);margin:0;max-width:11em;text-align:left}
/* ---------- strengths / growing edges, condensed ---------- */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.duo .box{margin-top:0}
.duo .box>h3{font-size:17px;padding:9px 8px}
.duo .box>.bd{padding:12px 10px 12px}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{background:var(--chip-bg);border-radius:12px;padding:5px 10px 4px;font:600 14.5px/1.3 Fredoka,"Trebuchet MS",sans-serif;color:var(--brown)}
/* ---------- tap-to-open panels ---------- */
.acc{background:var(--paper);border-radius:16px;margin-top:14px}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:10px 14px 10px 16px;font:600 16.5px/1.25 Fredoka,"Trebuchet MS",sans-serif;color:var(--brown);border-radius:16px}
.acc summary::-webkit-details-marker{display:none}
.acc summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pm{flex:none;width:28px;height:28px;border-radius:50%;background:var(--chip-bg)}
.pm::before,.pm::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2.4px;margin:-1.2px 0 0 -6px;border-radius:2px;background:var(--brown);transition:transform .2s}
.pm::after{transform:rotate(90deg)}
details[open]>summary .pm::after{transform:rotate(0)}
details:not([open]) .op,details[open] .cl{display:none}
.dc{padding:0 16px 10px}
.dc>:first-child{margin-top:4px}
.sub{font:600 16px Fredoka,"Trebuchet MS",sans-serif;color:var(--brown);margin:14px 0 6px}
/* ---------- the Helper's Crossroads path ---------- */
.lead{text-wrap:balance;hyphens:manual;font:400 20px/1.2 Sniglet,sans-serif;color:var(--brown);text-align:center;margin:2px 0 10px}
.axl{font:600 13px Fredoka,"Trebuchet MS",sans-serif;color:var(--soft);margin:4px 0 12px}
.path{list-style:none;margin:0;padding:0 0 0 34px;position:relative}
.path::before{content:"";position:absolute;left:12px;top:22px;bottom:46px;border-left:3.5px dashed var(--path-line)}
.stone{background:var(--space-row);border-radius:16px;padding:11px 11px 9px 12px;margin:0 0 16px}
.stone .node{position:absolute;left:-32px;top:17px;width:20px;height:20px;border-radius:50%;background:var(--s)}
.shd{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
.word{font-size:21px;padding:5px 8px 4px}
.role{font:600 12px/1.2 Fredoka,"Trebuchet MS",sans-serif;color:var(--role-text);background:var(--role-bg);border-radius:99px;padding:4px 9px 3px}
.sq{font:600 16.5px/1.3 Fredoka,"Trebuchet MS",sans-serif;color:var(--brown)}
.can{font-size:14.5px;line-height:1.45;margin:8px 0 0}
.sseed{display:flex;align-items:center;gap:7px;margin-top:9px;font:600 13.5px/1.25 Fredoka,"Trebuchet MS",sans-serif;color:var(--soft)}
.sface{flex:none;width:20px;height:20px;border-radius:50%;background:var(--s);object-fit:cover}
.yours{display:block;color:var(--brown);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.adots{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none}
.ad{width:var(--z);height:var(--z);border-radius:50%;background:var(--chip-bg)}
.ad.on{background:var(--s)}
.stone.me{background:var(--tint)}
.stone.by{background:var(--by-row)}
.here,.flag{position:absolute;right:-6px;top:-13px;font:700 11.5px/1 Fredoka,"Trebuchet MS",sans-serif;letter-spacing:.05em;border-radius:99px;padding:5px 10px 4px;z-index:3;transform:rotate(3deg)}
.here{background:var(--here-bg);color:var(--here-text)}
.flag{background:var(--space-label);color:var(--space-label-text);transform:rotate(-3deg)}
.between{font-size:14px;font-style:italic;color:var(--soft);margin:-4px 0 16px}
.place{font-size:15px;text-align:center;margin:4px 0 0}
.next{background:var(--next-bg);border-radius:14px;padding:11px 14px 10px;margin:16px 0 4px}
.next b{display:block;font:600 16px Fredoka,"Trebuchet MS",sans-serif;color:var(--brown)}
.next p{margin:2px 0 0}
/* ---------- full descriptions + answers decoded ---------- */
.fr .row{background:var(--space-row)}
.dec{list-style:none;margin:0 0 10px;padding:0;display:grid}
.dec li{padding:9px 0;border-top:2px dashed var(--meter-track)}
.dec li:first-child{border-top:0}
.dq{display:block;font:600 14px Fredoka,"Trebuchet MS",sans-serif;color:var(--soft)}
.da{display:block;font-size:15px;margin:1px 0 5px}
.drow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.dchip{font:700 12.5px/1 Fredoka,"Trebuchet MS",sans-serif;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:5px 10px 4px;background:var(--s);color:var(--st)}
.wt{display:inline-flex;align-items:center;gap:7px;font:600 13px Fredoka,"Trebuchet MS",sans-serif;color:var(--soft)}
.wm{display:inline-block;width:56px;height:10px;border-radius:9px;background:var(--meter-track)}
.wm>i{display:block;height:100%;border-radius:9px;background:var(--meter)}
.tot{font:600 15px Fredoka,"Trebuchet MS",sans-serif;color:var(--brown);margin:0 0 8px}

/* ---------- pencil outline layer ----------
   Outlines are drawn in JS with rough.js (MIT, github.com/rough-stuff/rough) into a small <svg class="pn"> inside each element.
   Colours come from the variables below, so the colour editor still works: --ol line colour, --sc sketch-shadow colour,
   --sx/--sy shadow offset (changed on hover/press), --lw line weight, --dash for dashed lines. */
:root{--line-w:1.35px;--line-w-s:1.1px;--hatch-w:.8px}
.foot{position:relative}
.win,.plaque,.cvw,.intro,.opt,.opt .k,.btn,.box,.mini,.plate,.pills li,.tag,.peek,.row em,.row.me,.row.by,.ph,.qw,.foot span,
.hstyle,.hchip,.pin,.sbar,.chips li,.acc,.pm,.stone,.word,.role,.here,.flag,.sface,.ad,.next,.dchip,.wm,.stone .node{position:relative;--ol:var(--brown);--lw:var(--line-w);--sc:transparent;--sx:0px;--sy:0px;--dash:none}
.stone .node,.here,.flag{position:absolute}
.stone,.acc{--sc:var(--box-shadow);--sx:2px;--sy:4px}
.stone.me{--ol:var(--s);--lw:calc(var(--line-w) + 1.2px);--sc:var(--s);--sx:3px;--sy:5px}
.stone.by{--ol:var(--by-line);--dash:5 4}
.here,.flag{--sc:var(--brown);--sx:1px;--sy:2px}
.hchip,.word,.pin,.sbar,.chips li,.role,.sface,.ad,.dchip,.wm,.pm,.stone .node{--lw:var(--line-w-s)}
.next{--dash:5 4}
.hstyle{--lw:var(--line-w-s)}
.pn{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pn .ln{stroke:var(--ol);stroke-width:var(--lw);stroke-dasharray:var(--dash);opacity:.92}
.pn .sh{stroke:var(--sc);stroke-width:var(--hatch-w);transform:translate(var(--sx),var(--sy));transition:transform .1s}
.pn .sf{fill:var(--scallop);stroke:none}
.stm{z-index:3}
.bar{border-radius:26px 26px 0 0}.foot{border-radius:0 0 26px 26px}
.cvw{border-radius:20px;line-height:0}
.intro,.box,.cvw{--sc:var(--box-shadow);--sx:3px;--sy:5px}
.win{--sc:var(--win-shadow);--sx:4px;--sy:7px}
.box.cta{--sc:var(--cta-shadow);--sx:4px;--sy:8px;--lw:calc(var(--line-w) + .3px)}
.opt{--ol:var(--bd);--sc:var(--bd);--sx:3px;--sy:4px}
.btn,.mini{--sc:var(--brown);--sx:3px;--sy:4px}
.pills li{--sc:var(--brown);--sx:2px;--sy:3px}
@media(hover:hover){.opt:hover,.btn:hover,.mini:hover{--sx:3px;--sy:6px}}
.opt:active,.opt.on,.btn:active,.mini:active{--sx:1px;--sy:1px}
.opt .k,.tag,.row em,.peek,.peek .btn,.foot span{--lw:var(--line-w-s)}
.peek .btn{--sx:2px;--sy:2px}
.peek,.foot span,.row.by,.ph{--dash:5 4}
.ph{--ol:#d4b77a}.plate>.ph{--ol:var(--brown)}
.row.me{--ol:var(--mo)}.row.by{--ol:var(--by-line)}
.btn.start{background:var(--start-bg);color:var(--start-text);--ol:var(--start-line);--sc:var(--start-line);font-size:22px;padding:17px 39px;min-height:62px;gap:10px;animation:hop 2.6s ease-in-out infinite}
.btn.start svg:not(.pn){width:26px;height:26px;flex:none}
@keyframes hop{0%,70%,100%{transform:translateY(0)}78%{transform:translateY(-6px) rotate(-1.5deg)}86%{transform:translateY(0)}92%{transform:translateY(-3px) rotate(1deg)}}
.btn.start:active{animation:none}

/* ---------- email step (Cloudflare build) ---------- */
.gate .bd{padding:14px 18px 18px}
.gl{display:block;font:600 15px Fredoka,"Trebuchet MS",sans-serif;margin:4px 0 6px}
.gate input[type=email]{width:100%;font:500 16px Mali,sans-serif;padding:12px 14px;border:1.5px solid var(--brown);border-radius:14px;background:#fff;color:var(--ink)}
.gate input[type=email]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.gc{display:flex;gap:10px;align-items:flex-start;margin:14px 0 6px;font-size:14.5px;line-height:1.45;cursor:pointer}
.gc input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--deep-btn)}
.gate .small{margin:6px 0 0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.gate .btn{display:flex;margin:16px auto 0}
.gate .btn[disabled]{opacity:.65;cursor:wait}
.gmsg{min-height:1.3em;font-size:14px;margin:10px 0 0;text-align:center}
.gmsg.err{color:#a82a1c;font-weight:600}
.btns.one{grid-template-columns:minmax(0,1fr);justify-items:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- Option A: pencil storybook boxes (pairs with optionA.js) ----------
   Fill:   the element keeps its normal CSS background (so every colour variable, :hover/.on state and the colour editor still work),
           but paints it only behind its own text glyphs (background-clip:text, invisible under the text colour).
           A ::before copies the same background (background:inherit) and is clipped to a hand-wobbled path (clip-path:var(--pnf))
           that the outline follows, so the fill edge wobbles with the pencil line.
   Hatch:  coloured-pencil hachure in a .pnh svg behind the content (ink + paper-light strokes, so it reads on any fill colour).
   Tooth:  subtle paper speckle pattern on the static boxes (an SVG pattern of a tiny noise tile; no filters, no repaint cost).
   Line:   pass 1 follows the fill edge (.ln), pass 2 is a thinner, lighter rough.js stroke (.ln2) for pressure variation.
   Shadow: the offset sketch shadow is now cross-hatched (two directions). */
.pnA{isolation:isolate;background-clip:text!important;-webkit-background-clip:text!important}
.pnA::before{content:"";position:absolute;inset:var(--pni,-3px);background:inherit;background-clip:border-box!important;-webkit-background-clip:border-box!important;
  clip-path:var(--pnf);border-radius:0;z-index:-1;pointer-events:none}
.pnHd{position:relative}
.pnh{position:absolute;left:0;top:0;z-index:-1;pointer-events:none;overflow:visible;fill:none;stroke-linecap:round}
.pnh .ht{stroke:var(--hatch-ink,rgba(67,48,46,.16));stroke-width:1.1}
.pnh .ht2{stroke:var(--hatch-light,rgba(255,249,227,.3));stroke-width:1.4}
.pnh .tt{stroke:none}
.pn .ln2{stroke:var(--ol);stroke-width:calc(var(--lw) * .62);opacity:.42}
</style>
</head>
